project:
  type: website

website:
  title: "OpenLayers Webmap Tutorial"
  description: "A practical tutorial for creating, configuring and publishing interactive webmaps with OpenLayers."

  navbar:
    logo: ./images/utu-logo.jpg
    logo-alt: "University of Turku"
    title: "UTU Geospatial Labs"
    background: "#ffffff"
    foreground: "#183653"
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: "https://opas.peppi.utu.fi/en/course/MAAN7771/100913?period=2024-2027"
        text: Master's course
      - href: "https://github.com/UTU-Geospatial-Labs/openlayers-tutorial"
        text: GitHub
    right:
      - icon: github
        href: "https://github.com/UTU-Geospatial-Labs/openlayers-tutorial"
        aria-label: "Open the tutorial repository on GitHub"

  sidebar:
    style: docked
    search: true
    contents:
      - section: "Chapters"
        contents:
          - 01-setup.qmd
          - 02-wms-layer.qmd
          - 03-map-view.qmd
          - 04-geojson-layers.qmd
          - 05-vector-styles.qmd
          - 06-basemap-switcher.qmd
          - 07-legend.qmd
          - 08-title.qmd
          - 09-info-panel.qmd
          - 10-publish.qmd
          - references.qmd

  page-footer:
    left: |
      OpenLayers Webmap Tutorial · UTU Geospatial Labs
    right: |
      [Source code](https://github.com/UTU-Geospatial-Labs/openlayers-tutorial)

  repo-url: https://github.com/UTU-Geospatial-Labs/openlayers-tutorial
  repo-actions: [source]

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-copy: true
    smooth-scroll: true
